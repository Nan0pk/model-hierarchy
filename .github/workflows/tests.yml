name: tests

on:
  push:
    branches: [main]
  pull_request: {}
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: |
          pip install -e '.[dev]'
          npm ci

      - name: Validate configuration & run Python tests
        run: |
          python -m hierarchy validate
          pytest -q
          ruff check hierarchy tests

      - name: Run dashboard regression tests
        run: npm test

      - name: Offline build smoke check
        run: |
          python -m hierarchy boards
          python -m hierarchy demo --reps 200
