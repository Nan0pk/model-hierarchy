# Daily hierarchy refresh — METHODOLOGY.md §12
# 06:00 UTC: fetch → aggregate → render → auto-commit if anything changed.
# Any single source failing (endpoint moved, HTML changed, Cloudflare) is logged
# and non-fatal: the day's hierarchy is computed from everything that succeeded,
# with staleness flags telling the reader exactly what fell behind.
# No secrets are required for v1 — all sources are public pages.

name: daily

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: daily
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      - name: Fetch → aggregate → render (soft-fail per source)
        run: python -m hierarchy run

      - name: Contract tests
        run: pytest -q

      - name: Auto-commit if anything changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes — nothing to commit."
          else
            git commit -m "daily: hierarchy refresh $(date -u +%F)"
            git push
          fi
