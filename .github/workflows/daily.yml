name: daily-update

on:
  schedule:
    - cron: "0 6 * * *" # 06:00 UTC daily
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: daily-update
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      - name: Validate config
        run: python -m hierarchy validate

      - name: Fetch sources (soft-fail per source)
        run: python -m hierarchy fetch --allow-missing

      - name: Aggregate + render
        run: python -m hierarchy run

      - name: Contract tests
        run: pytest -q

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes today."
          else
            git commit -m "data: daily hierarchy update $(date -u +%F)"
            git push
          fi
