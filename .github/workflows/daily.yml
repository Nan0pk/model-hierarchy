# Daily hierarchy refresh — METHODOLOGY.md §5
# 06:00 UTC: fetch → aggregate → render → test → auto-commit if meaningful data changed.
# Any single source failing (endpoint moved, HTML/SPA changed, Cloudflare) is logged
# and non-fatal: the day's publication retains last-good snapshots without re-dating
# them and surfaces refresh health explicitly. Timestamp-only diffs never commit.

name: daily

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

concurrency:
  group: daily
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install Python & dashboard test dependencies
        run: |
          pip install -e '.[dev]'
          npm ci

      - name: Fetch → aggregate → render (soft-fail per source)
        run: python -m hierarchy run

      - name: Export the Atlas rankings with the dashboard's own code
        run: node dashboard/export.mjs

      - name: Sync dashboard cache stamps
        run: node dashboard/stamps.mjs

      - name: Python & dashboard contract tests
        run: |
          pytest -q
          ruff check hierarchy tests
          npm test

      - name: Report failing sources to a tracking issue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/report_refresh_failures.py

      - name: Auto-commit if meaningful data changed
        run: |
          if git status --porcelain | grep -q '^??'; then
            MEANINGFUL=1
          elif git diff -I '"generated_at":' -I '"attempted_at":' --quiet; then
            MEANINGFUL=0
          else
            MEANINGFUL=1
          fi
          if [ "$MEANINGFUL" -eq 0 ]; then
            git checkout -- .
            echo "No meaningful data changes — skipping timestamp-only commit."
          else
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "daily: hierarchy refresh $(date -u +%F)"
            git push
          fi
