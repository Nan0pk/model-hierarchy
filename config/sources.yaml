# ============================================================================
# Model Hierarchy — data sources (fetch layer)
# Where numbers come from and how hard to try before falling back to
# data/manual/scores.csv (the guaranteed path, METHODOLOGY.md §12).
#
# roles:
#   scored      - fetched numbers feed the aggregate directly
#   mirror      - aggregation site republishing the same underlying benchmarks
#                 (llmstat). NEVER a separate scored voice (double counting, §4).
#   optional    - off by default (double counting with registered benchmarks, §4)
# ============================================================================

defaults:
  timeout_seconds: 20
  retries: 2
  user_agent: "model-hierarchy/1.0 (+https://github.com/Nan0pk/model-hierarchy)"

sources:
  # ---- Scored: Pillar 1 (Human Preference) --------------------------------
  lm_arena_elo:
    role: scored
    kind: lm_arena
    cadence: daily
    # Adapter order (hierarchy/fetch/base.py):
    # 1) CANONICAL: official HF dataset lmarena-ai/leaderboard-dataset
    #    (CC-BY-4.0) via the public datasets-server JSON API — config
    #    text_style_control, split latest, category=overall; carries per-model
    #    95% CIs and the leaderboard publish date.
    # 2) Community mirror API (clean JSON) as fallback.
    # 3) Manual drop into data/manual/scores.csv.
    canonical: https://huggingface.co/datasets/lmarena-ai/leaderboard-dataset
    endpoints:
      - https://api.wulong.dev/arena-ai-leaderboards/v1/leaderboard?name=text
    fallback_note: >
      If both paths fail, copy Elo + CI from lmarena.ai/leaderboard
      (style-control column) into data/manual/scores.csv with
      benchmark=lm_arena_elo.

  openrouter_usage:
    role: scored
    kind: openrouter
    cadence: daily
    # Adapter parses the server-rendered table captioned "Model rankings by
    # tokens processed" (most recent complete day) and converts tokens to
    # share-of-parsed-total (%).
    endpoints:
      - https://openrouter.ai/rankings
    fallback_note: >
      If the page shape changes, copy top-model token shares into
      data/manual/scores.csv with benchmark=openrouter_usage (score = share
      in percent).

  # ---- Scored: capability benchmarks --------------------------------------
  # Use only adapters for stable, source-owned endpoints with matching score
  # semantics. Mark sources kind: manual when no defensible automation exists.
  gpqa_diamond:
    role: scored
    kind: manual
    cadence: monthly
    source: https://huggingface.co/datasets/Idavidrein/gpqa
    fallback_note: No benchmark-operator-run public model leaderboard is available. Record the exact model-card or evaluation report URL, test-time compute, and score in the manual CSV; do not ingest unverified leaderboard aggregations as ground truth.

  livebench_overall:
    role: scored
    kind: manual
    cadence: release
    source: https://livebench.ai
    fallback_note: The current official site publishes LiveBench 2.0 (agent-task suites), which is not the historical LiveBench overall metric defined by this methodology. Keep manual until the methodology and weights are deliberately migrated to the new benchmark.

  seal_average:
    role: scored
    kind: manual
    cadence: monthly
    source: https://scale.com/leaderboard
    fallback_note: The legacy SEAL average has no confirmed current machine-readable endpoint. Only enter scores tied to the SEAL benchmark and its stated release; do not scrape the current Scale Labs leaderboard as a substitute.

  aime_2025:
    role: scored
    kind: manual
    cadence: monthly
    fallback_note: Average of AIME 2025 (I/II), no-tools setting, vendor-reported or orchestrator-run (preferred).

  hmmt_feb_2025:
    role: scored
    kind: manual
    cadence: monthly
    fallback_note: HMMT Feb 2025 scores, no-tools setting.

  math_500:
    role: scored
    kind: manual
    cadence: quarterly
    fallback_note: Near-saturated legacy anchor (weight 0.03 only).

  swebench_verified:
    role: scored
    kind: swebench
    cadence: weekly
    url: https://api.github.com/repos/SWE-bench/swe-bench.github.io/contents/data/leaderboards.json
    benchmark: swebench_verified
    leaderboard_spec:
      board: Verified
      agent: mini-SWE-agent
    provenance_type: orchestrator_run
    fallback_note: Official Verified board, restricted to the mini-SWE-agent harness so scores are not selected across unrelated agent scaffolds.

  livecodebench:
    role: scored
    kind: livecodebench
    cadence: release
    url: https://livecodebench.github.io/leaderboard.html
    benchmark: livecodebench
    table_spec:
      date_regex: 'to (\d{1,2}/\d{1,2}/\d{4})'
    fallback_note: Official LiveCodeBench leaderboard; the scrape records the end date of the current evaluation window, so stale releases are excluded by the normal staleness policy.

  terminal_bench:
    role: scored
    kind: manual
    cadence: monthly
    source: https://www.tbench.ai
    fallback_note: The official board mixes model and agent harnesses. Keep manual until the methodology declares a fixed harness; do not cherry-pick the best agent result per model. One verified score feeds both registered pillar aliases.

  tau2_bench:
    role: scored
    kind: manual
    cadence: monthly
    fallback_note: Average across published Tau²-bench domains.

  # ---- Mirror (never scored — §4) ------------------------------------------
  llmstat:
    role: mirror
    kind: llmstat
    url: https://llmstat.info
    note: >
      llmstat republishes the same underlying benchmark numbers; use it to
      source manual drops, not as an extra voice, or every benchmark gets
      double-counted.

  # ---- Optional (off by default — §4) --------------------------------------
  artanalysis_index:
    role: optional
    enabled: false
    kind: manual
    url: https://artificialanalysis.ai/models/benchmarks
    note: >
      AA Intelligence Index already aggregates GPQA and other registered
      benchmarks. Enable ONLY as a wholesale P2 substitution, never alongside
      its components, and say so in anything you publish from it.
