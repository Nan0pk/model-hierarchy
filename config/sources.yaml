# ============================================================================
# Model Hierarchy — data sources (fetch layer)
# Where numbers come from and how hard to try before falling back to
# data/manual/scores.csv (see METHODOLOGY.md §6).
#
# roles:
#   scored      - fetched numbers feed the aggregate directly
#   mirror      - aggregation site republishing the same underlying benchmarks
#                 (llmstat). NEVER a separate scored voice (double counting, §4).
#   optional    - off by default (double counting with registered benchmarks, §4)
# ============================================================================

defaults:
  timeout_seconds: 20
  retries: 2
  user_agent: "model-hierarchy/1.0 (+https://github.com/Nan0pk/model-hierarchy)"

sources:
  # ---- Human preference; usage below is contextual only -------------------
  lm_arena_elo:
    role: scored
    kind: lm_arena
    cadence: daily
    # Canonical complete style-control dataset only. No raw-score mirror or
    # partial first-rows fallback. Public native boards are configured separately
    # in config/leaderboards.yaml and never scored in these legacy slots.
    canonical: https://huggingface.co/datasets/lmarena-ai/leaderboard-dataset
    fallback_note: >
      If the official dataset fails, copy style-controlled rating + CI from lmarena.ai/leaderboard
      (style-control column) into data/manual/scores.csv with
      benchmark=lm_arena_elo.

  openrouter_usage:
    role: context
    kind: openrouter
    cadence: daily
    # Adapter parses the server-rendered table captioned "Model rankings by
    # tokens processed" (most recent complete day) and converts tokens to
    # share-of-parsed-total (%).
    endpoints:
      - https://openrouter.ai/rankings
    fallback_note: >
      If the page shape changes, copy top-model token shares into
      data/manual/scores.csv with benchmark=openrouter_usage (score = share
      in percent).

  # Usage is context only: never an eligibility gate or capability score.

  # ---- Scored: capability benchmarks --------------------------------------
  # Use adapters for benchmark-owner or independently evaluated endpoints with
  # explicit score semantics, dates, and compatible methodologies. Mark all
  # unverified or mismatched sources manual; never use scrape time as freshness.
  gpqa_diamond:
    role: scored
    kind: vals_table
    cadence: monthly
    url: https://www.vals.ai/benchmarks/gpqa
    benchmark: gpqa_diamond
    table_spec:
      model_header: Model
      score_header: Accuracy
      date_regex: '([A-Za-z]{3,9} \d{1,2}, \d{4})'
    provenance_type: independent_evaluation
    qualification: "GPQA Diamond: 198-question Diamond subset; Vals AI prompting and answer parsing; archived board"
    fallback_note: Vals AI independently evaluates models and publishes the method/date; its GPQA board is archived after saturation and is subject to the standard 90-day cutoff.

  mmlu_pro:
    role: scored
    kind: vals_table
    cadence: monthly
    url: https://www.vals.ai/benchmarks/mmlu_pro
    benchmark: mmlu_pro
    table_spec:
      model_header: Model
      score_header: Accuracy
      date_regex: '([A-Za-z]{3,9} \d{1,2}, \d{4})'
    provenance_type: independent_evaluation
    qualification: "MMLU-Pro: 14-subject academic knowledge benchmark; Vals AI implementation; archived board"
    fallback_note: Vals AI's independently evaluated MMLU-Pro provides an additional knowledge-reasoning signal; archived results retain their published date and obey the 90-day cutoff.

  livebench_overall:
    role: scored
    kind: manual
    cadence: release
    source: https://livebench.ai
    fallback_note: The current official site publishes LiveBench 2.0 (agent-task suites), which is not the historical LiveBench overall metric defined by this methodology. Keep manual until the methodology and weights are deliberately migrated to the new benchmark.

  seal_average:
    role: scored
    kind: manual
    cadence: monthly
    source: https://scale.com/leaderboard
    fallback_note: The legacy SEAL average has no confirmed current machine-readable endpoint. Only enter scores tied to the SEAL benchmark and its stated release; do not scrape the current Scale Labs leaderboard as a substitute.

  aime_2025:
    role: scored
    kind: manual
    cadence: monthly
    fallback_note: Average of AIME 2025 (I/II), no-tools setting, vendor-reported or orchestrator-run (preferred).

  hmmt_feb_2025:
    role: scored
    kind: manual
    cadence: monthly
    fallback_note: HMMT Feb 2025 scores, no-tools setting.

  math_500:
    role: scored
    kind: manual
    cadence: quarterly
    fallback_note: Near-saturated legacy anchor (weight 0.03 only).

  swebench_verified:
    role: scored
    kind: vals_table
    cadence: monthly
    url: https://www.vals.ai/benchmarks/swebench
    benchmark: swebench_verified
    table_spec:
      model_header: Model
      score_header: Score
      date_regex: '([A-Za-z]{3,9} \d{1,2}, \d{4})'
      filter_header: Harness
      filter_value: Mini-SWE-agent
    provenance_type: independent_evaluation
    qualification: "SWE-bench Verified; Mini-SWE-agent harness only; archived board"
    fallback_note: Vals AI's current archived leaderboard evaluates a fixed Mini-SWE-agent harness; other mixed-harness boards are not pooled.

  livecodebench:
    role: scored
    kind: vals_table
    cadence: monthly
    url: https://www.vals.ai/benchmarks/lcb
    benchmark: livecodebench
    table_spec:
      model_header: Model
      score_header: Accuracy
      date_regex: '([A-Za-z]{3,9} \d{1,2}, \d{4})'
    provenance_type: independent_evaluation
    qualification: "LiveCodeBench v6; Code Generation task in Python; Vals AI implementation; archived board"
    fallback_note: Uses Vals AI's independently evaluated LiveCodeBench results and published evaluation date; this is not the stale official scrape or LiveBench.

  terminal_bench:
    role: scored
    kind: manual
    cadence: monthly
    source: https://www.tbench.ai
    fallback_note: The official board mixes model and agent harnesses. Keep manual until the methodology declares a fixed harness; do not cherry-pick the best agent result per model. One verified score feeds both registered pillar aliases.

  tau2_bench:
    role: scored
    kind: manual
    cadence: monthly
    fallback_note: Average across published Tau²-bench domains.

  # ---- Mirror (never scored — §4) ------------------------------------------
  llmstat:
    role: mirror
    kind: llmstat
    url: https://llmstat.info
    note: >
      llmstat republishes the same underlying benchmark numbers; use it to
      source manual drops, not as an extra voice, or every benchmark gets
      double-counted.

  # ---- Optional (off by default — §4) --------------------------------------
  artanalysis_index:
    role: optional
    enabled: false
    kind: manual
    url: https://artificialanalysis.ai/models/benchmarks
    note: >
      AA Intelligence Index already aggregates GPQA and other registered
      benchmarks. Enable ONLY as a wholesale P2 substitution, never alongside
      its components, and say so in anything you publish from it.
